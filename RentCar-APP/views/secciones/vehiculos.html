<div class="card mt-5 shadow-sm">
    <div class="card-body">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="mb-0">Vehículos</h4>

            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalAgregarVehiculo">
                <i class="fas fa-plus me-2"></i> Agregar
            </button>
        </div>

        <!-- MENSAJES -->
        <div class="alert alert-success d-none" id="mensajeExito">
            Vehículo creado correctamente
        </div>

        <div class="alert alert-danger d-none" id="mensajeError">
            Ocurrió un error al crear el vehículo
        </div>

        <div class="table-responsive">
            <table class="table align-middle">

                <thead class="table-light">
                    <tr>
                        <th>Marca</th>
                        <th>Modelo</th>
                        <th>Tipo</th>
                        <th>Año</th>
                        <th>Matrícula</th>
                        <th>Puestos</th>
                        <th>Precio/Día</th>
                        <th>Estado</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                </thead>

                <tbody id="vehiculos-body">
                    <!-- filas generadas dinámicamente por JavaScript -->
                </tbody>

            </table>
        </div>

    </div>
</div>


<!-- MODAL AGREGAR VEHÍCULO -->

<div class="modal fade" id="modalAgregarVehiculo" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Agregar vehículo</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <form id="formAgregarVehiculo">
                    <div class="mb-3">
                        <label class="form-label">Marca</label>
                        <input type="text" id="addMarca" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Modelo</label>
                        <input type="text" id="addModelo" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Tipo</label>
                        <select id="addTipo" class="form-select">
                            <option selected disabled>Seleccionar...</option>
                            <option>Sedán</option>
                            <option>SUV</option>
                            <option>Pickup</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Año</label>
                        <input type="number" id="addAno" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Matrícula</label>
                        <input type="text" id="addMatricula" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Cantidad de puestos</label>
                        <input type="number" id="addPuestos" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Precio por día</label>
                        <input type="number" id="addPrecio" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Estado</label>
                        <select id="addEstado" class="form-select">
                            <option selected disabled>Seleccionar...</option>
                            <option>Disponible</option>
                            <option>Alquilado</option>
                        </select>
                    </div>

                    <div class="text-end">

                        <button type="button" class="btn btn-outline-secondary me-2" data-bs-dismiss="modal">
                            Cancelar
                        </button>

                        <button type="submit" class="btn btn-primary">
                            Crear
                        </button>

                    </div>

                </form>

            </div>

        </div>
    </div>
</div>



<!-- MODAL EDITAR VEHÍCULO -->

<div class="modal fade" id="modalEditarVehiculo" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Editar vehículo</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <form id="formEditarVehiculo">
                    <input type="hidden" id="editIndex">
                    <div class="mb-3">
                        <label class="form-label">Marca</label>
                        <input type="text" id="editMarca" class="form-control" value="Toyota">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Modelo</label>
                        <input type="text" id="editModelo" class="form-control" value="Corolla">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Tipo</label>
                        <select id="editTipo" class="form-select">
                            <option>Sedán</option>
                            <option>SUV</option>
                            <option>Pickup</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Año</label>
                        <input type="number" id="editAno" class="form-control" value="2023">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Matrícula</label>
                        <input type="text" id="editMatricula" class="form-control" value="ABC-1234">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Cantidad de puestos</label>
                        <input type="number" id="editPuestos" class="form-control" value="5">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Precio por día</label>
                        <input type="number" id="editPrecio" class="form-control" value="50">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Estado</label>
                        <select id="editEstado" class="form-select">
                            <option>Disponible</option>
                            <option>Alquilado</option>
                        </select>
                    </div>

                    <div class="text-end">

                        <button type="button" class="btn btn-outline-secondary me-2" data-bs-dismiss="modal">
                            Cancelar
                        </button>

                        <button type="submit" class="btn btn-primary">
                            Guardar cambios
                        </button>

                    </div>

                </form>

            </div>

        </div>
    </div>
</div>

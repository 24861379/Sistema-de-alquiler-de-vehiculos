<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    
    <!-- Estilos CSS -->
    <link rel="stylesheet" href="./style/inicioSesion.css">
    <!--Kit parar iconos-->
    <script src="https://kit.fontawesome.com/bc51cbe2c5.js" crossorigin="anonymous"></script><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
</head>
<body>
    <div class="container">
        <div id="alertContainer"></div>
        <form id="loginForm">
            <div class="mb-3">
                <label for="Email" class="form-label">Ingrese su correo electronico</label>
                <input type="email" class="form-control" id="Email" placeholder="email@rentcar.com" required>
            </div>
            <div class="mb-3">
                <label for="Password" class="form-label">Ingrese su contraseña</label>
                <div class="position-relative">
                    <input type="password" class="form-control pe-5" id="Password" required>
                    <span id="togglePassword" class="position-absolute top-50 end-0 translate-middle-y me-3" style="cursor: pointer;" aria-label="Mostrar u ocultar contraseña">
                        <i class="fa-regular fa-eye-slash" id="eyeIcon"></i>
                    </span>
                </div>
                
            </div>
            <button type="submit" class="btn" id="loginBtn">
                <span id="btnText">Ingresar</span>
                <span id="loadingSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true">
                </span>
            </button>
        </form>
        
    </div>
    
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <!-- scripts de la aplicación -->
    <script src="services/service.js"></script>
    <script src="controllers/controller.js"></script>
    <script src="Home.js"></script>
    <script type="module" src="./controllers/authController.js"></script>
</body>
</html>
